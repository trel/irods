openapi: 3.0.3

# OpenAPI description of the iRODS Control Plane Service.
#
# This file is a companion to controlplane-spec.md, which is the
# authoritative specification. It describes only the HTTP surface: paths,
# methods, bodies, status codes, headers, and authentication. Configuration,
# the federation approve sequence, the zone key lifecycle rules, expiration,
# and concurrency live in the markdown spec and are referenced by section
# number below.
#
# test_controlplane.py loads this file and validates every request the suite
# sends and every response it receives against it, so the document and
# controlplane.py cannot drift apart silently.

info:
  title: iRODS Control Plane Service
  version: 0.1.0
  description: |
    The control plane fronts one iRODS zone (the home zone) and runs as its
    service account on a catalog provider. It offers three features:

    - **federation**: a remote zone applies to federate with the home zone,
      a rodsadmin approves or rejects, and on approval the service performs
      the home-zone side and hands the applicant its federation stanza.
    - **keyserver**: a rodsadmin reads the lifecycle of the home zone's
      `zone_key` (current key, expiry, already-minted next key).
    - **bootstrap**: a rodsadmin creates a single-use bootstrap key bound
      to a catalog service role; whoever redeems it within its lifetime
      receives the zone facts needed to run `setup_irods.py` and join the
      zone. Creating the key is the approval.

    All request and response bodies are JSON. Every error response is the
    `Error` object. Unknown paths answer `404`, a known path with the wrong
    method answers `405` with an
    `Allow` header listing the methods that path accepts, and a request
    body larger than `max_request_body_bytes` answers `413`. Any unhandled
    failure answers `500`. A trailing slash on a path is ignored.

    Before handling any request the service runs the lazy expiration sweep
    of spec section 8, so a `pending` federation application or an
    `available` bootstrap key whose `expires_at` has passed is `expired`
    by the time any endpoint reports on it.

    The service speaks plain HTTP and must run behind a TLS-terminating
    proxy. It assumes the channel to every client is already encrypted:
    admin credentials travel in HTTP Basic headers and every secret in a
    response travels as a plain JSON field.
  contact:
    name: iRODS Consortium
    url: https://irods.org
  license:
    name: BSD-3-Clause
    url: https://github.com/irods/irods/blob/main/LICENSE

externalDocs:
  description: controlplane-spec.md, the authoritative specification
  url: ./controlplane-spec.md

servers:
  - url: /
    description: |
      Wherever this control plane instance, or the TLS-terminating proxy in
      front of it, is reachable. The listening port comes from the `port`
      key of the service configuration file and defaults to 1248.

tags:
  - name: service
    description: Unauthenticated description of this service.
  - name: federation
    description: Zone-to-zone federation applications (spec 7.1).
  - name: keyserver
    description: Zone key lifecycle, rodsadmin only (spec 7.2).
  - name: bootstrap
    description: Bootstrap keys that admit new servers to the home zone (spec 7.3).

paths:
  /info:
    get:
      tags: [service]
      operationId: getInfo
      summary: Describe this service
      description: |
        Spec section 7.0. Publishes what a federation applicant needs to
        know before applying: the service name and version and the
        application expiration. No iRODS connection is made. The home
        zone's name is deliberately not published.
      responses:
        "200":
          description: Service description.
          headers:
            Cache-Control:
              description: Always `no-store`.
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
              example:
                service: controlplane
                version: 0.1.0
                federation:
                  application_expiration_in_seconds: 604800
        "500":
          $ref: "#/components/responses/InternalError"

  /federation/apply:
    post:
      tags: [federation]
      operationId: federationApply
      summary: Submit a federation application
      description: |
        Spec section 7.1.1. The body is a `FederationApplyRequest`.

        Processing order, each step answering as shown when it fails:

        1. The application is validated (spec 5.6). Unknown fields answer
           `400`.
        2. A full queue (`max_pending_applications` pending records)
           answers `503`.
        3. A `pending` application for the same `zone_name` answers `409`.
           Approved, rejected, and expired records do not block.
        4. The service generates `negotiation_key`, and `zone_key` when the
           applicant did not supply one, persists the record, and answers
           `201` with both keys.

        `apply` performs no iRODS operations. `name` and `email` are shown
        to the reviewing admin only and are never used for anything else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FederationApplyRequest"
            examples:
              full:
                summary: Application with the optional fields
                value:
                  zone_name: otherZone
                  zone_port: 1247
                  catalog_provider_hosts: [icat.other.example.org]
                  zone_key: OPTIONAL_EXISTING_ZONE_KEY
                  name: Optional Human Name
                  email: optional@example.org
              minimal:
                summary: Smallest valid application
                value:
                  zone_name: otherZone
                  zone_port: 1247
                  catalog_provider_hosts: [icat.other.example.org]
      responses:
        "201":
          description: Application accepted and queued as `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationApplyResponse"
              example:
                application_id: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
                status: pending
                expires_at: "2026-11-07T15:04:05Z"
                negotiation_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6
                zone_key: OPTIONAL_EXISTING_ZONE_KEY
                status_url: /federation/status?application_id=6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
        "400":
          description: |
            Malformed JSON, a validation failure (spec 5.6), unknown fields,
            or `zone_name` equal to the home zone's name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "zone_port must be an integer in [0, 65535]"
        "409":
          description: A `pending` application for the same `zone_name` already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: an application for zone otherZone is already pending
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The queue already holds `max_pending_applications` pending records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: application queue is full

  /federation/status:
    get:
      tags: [federation]
      operationId: federationStatus
      summary: Retrieve the state of one federation application
      description: |
        Spec section 7.1.2. The `application_id` is unguessable and acts as
        the bearer token; no other authentication is required.

        While the application is `pending`, `rejected`, or `expired` the
        response carries only the bookkeeping fields. Once it is `approved`
        the response also carries `applicant_federation_entry`, the object
        to append to the `federation` array of the applicant's
        `server_config.json`, and `applicant_mkzone_command`, the
        `iadmin mkzone` command the applicant must run.

        The home zone's own top-level `negotiation_key` is never disclosed;
        the pair-specific key from the record is used. `name` and `email`
        are never returned here.
      parameters:
        - name: application_id
          in: query
          required: true
          description: The id returned by `apply`. Must be given exactly once.
          schema:
            $ref: "#/components/schemas/ApplicationId"
      responses:
        "200":
          description: Current state of the application.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FederationStatusResponse"
                  - $ref: "#/components/schemas/ApprovedFederationStatusResponse"
              examples:
                pending:
                  value:
                    application_id: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
                    status: pending
                    submitted_at: "2026-10-31T15:04:05Z"
                    expires_at: "2026-11-07T15:04:05Z"
                    judged_at: null
                    decision_note: null
                approved:
                  value:
                    application_id: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
                    status: approved
                    submitted_at: "2026-10-31T15:04:05Z"
                    expires_at: "2026-11-07T15:04:05Z"
                    judged_at: "2026-11-01T09:00:00Z"
                    decision_note: looks good
                    applicant_federation_entry:
                      catalog_provider_hosts: [icat.home.example.org]
                      negotiation_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6
                      zone_key: HOME_ZONE_KEY
                      zone_key_signing_hash_scheme: sha256
                      zone_name: homeZone
                      zone_port: 1247
                    applicant_mkzone_command: iadmin mkzone homeZone remote icat.home.example.org:1247
        "400":
          description: "`application_id` missing, empty, or given more than once."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: application_id query parameter is required
        "404":
          $ref: "#/components/responses/NoSuchApplication"
        "500":
          $ref: "#/components/responses/InternalError"

  /federation/list:
    get:
      tags: [federation]
      operationId: federationList
      summary: List federation applications
      description: |
        Spec section 7.1.3. Returns full application records, including
        keys, `name`, and `email`, ordered by `submitted_at` ascending. The
        caller is a rodsadmin, so nothing is redacted.
      security:
        - rodsadminBasic: []
      parameters:
        - name: status
          in: query
          required: false
          description: Which records to return. Defaults to `pending`. Must be given at most once.
          schema:
            type: string
            enum: [pending, approved, rejected, expired, all]
            default: pending
      responses:
        "200":
          description: Matching records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationListResponse"
              example:
                applications:
                  - application_id: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
                    status: pending
                    submitted_at: "2026-10-31T15:04:05Z"
                    expires_at: "2026-11-07T15:04:05Z"
                    remote_address: 203.0.113.9
                    zone_name: otherZone
                    zone_port: 1247
                    catalog_provider_hosts: [icat.other.example.org]
                    zone_key: OPTIONAL_EXISTING_ZONE_KEY
                    zone_key_generated: false
                    negotiation_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6
                    name: Optional Human Name
                    email: optional@example.org
                    judged_at: null
                    judged_by: null
                    decision_note: null
        "400":
          description: "`status` is not one of the accepted values or was given more than once."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: status must be one of pending, approved, rejected, expired, all
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/IRODSUnreachable"

  /federation/judge:
    post:
      tags: [federation]
      operationId: federationJudge
      summary: Approve or reject a federation application
      description: |
        Spec section 7.1.4. The request body is read and parsed before the
        credentials are checked, so a malformed or oversized body answers
        `400` or `413` even without valid credentials.

        **Reject** marks the record `rejected` with `judged_at`,
        `judged_by`, and `decision_note`, persists it, and answers `200`
        with a `RejectResponse`. No iRODS actions are performed.

        **Approve** runs the home-zone side of federation under the global
        lock, in order: verify every applicant host resolves (`400`), verify
        no zone of that name exists in the home catalog (`409`), create the
        remote zone with the admin's own session, append the federation
        entry to the home `server_config.json` with a backup copy, send
        `SIGHUP` to the iRODS server, then mark the record `approved` and
        answer `200` with an `ApproveResponse`. A failing step answers
        `500` naming the step; earlier steps are rolled back where possible
        and the record stays `pending` so the admin can retry. A failed
        reload is the one case not rolled back: the catalog zone and the
        federation entry are correct and only the reload is outstanding, so
        judging again re-sends only the `SIGHUP`.
      security:
        - rodsadminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JudgeRequest"
            examples:
              approve:
                value:
                  application_id: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
                  decision: approve
                  decision_note: applicant confirmed by phone
              reject:
                value:
                  application_id: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
                  decision: reject
                  decision_note: unknown applicant
      responses:
        "200":
          description: The decision was applied and persisted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApproveResponse"
                  - $ref: "#/components/schemas/RejectResponse"
              examples:
                approved:
                  value:
                    application:
                      application_id: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
                      status: approved
                      submitted_at: "2026-10-31T15:04:05Z"
                      expires_at: "2026-11-07T15:04:05Z"
                      remote_address: 203.0.113.9
                      zone_name: otherZone
                      zone_port: 1247
                      catalog_provider_hosts: [icat.other.example.org]
                      zone_key: OPTIONAL_EXISTING_ZONE_KEY
                      zone_key_generated: false
                      negotiation_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6
                      name: null
                      email: null
                      judged_at: "2026-11-01T09:00:00Z"
                      judged_by: rods
                      decision_note: applicant confirmed by phone
                    home_federation_entry:
                      catalog_provider_hosts: [icat.other.example.org]
                      negotiation_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6
                      zone_key: OPTIONAL_EXISTING_ZONE_KEY
                      zone_key_signing_hash_scheme: sha256
                      zone_name: otherZone
                      zone_port: 1247
                    applicant_federation_entry:
                      catalog_provider_hosts: [icat.home.example.org]
                      negotiation_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6
                      zone_key: HOME_ZONE_KEY
                      zone_key_signing_hash_scheme: sha256
                      zone_name: homeZone
                      zone_port: 1247
                    applicant_mkzone_command: iadmin mkzone homeZone remote icat.home.example.org:1247
                rejected:
                  value:
                    application:
                      application_id: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c
                      status: rejected
                      submitted_at: "2026-10-31T15:04:05Z"
                      expires_at: "2026-11-07T15:04:05Z"
                      remote_address: 203.0.113.9
                      zone_name: otherZone
                      zone_port: 1247
                      catalog_provider_hosts: [icat.other.example.org]
                      zone_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P7
                      zone_key_generated: true
                      negotiation_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6
                      name: null
                      email: null
                      judged_at: "2026-11-01T09:00:00Z"
                      judged_by: rods
                      decision_note: unknown applicant
        "400":
          description: |
            Malformed JSON, unknown fields, missing `application_id`,
            `decision` other than `approve` or `reject`, a `decision_note`
            that is not a string of at most 1024 characters, or, on
            approve, an applicant host that does not resolve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                decision:
                  value:
                    error: decision must be "approve" or "reject"
                unresolvable:
                  value:
                    error: "catalog_provider_hosts entry 'icat.other.example.invalid' does not resolve: [Errno -2] Name or service not known; refusing to federate with an unresolvable host"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoSuchApplication"
        "409":
          description: |
            The application was already `approved` or `rejected`, or, on
            approve, a zone of that name already exists in the home catalog
            with different keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                judged:
                  value:
                    error: application has already been approved
                zone_exists:
                  value:
                    error: zone otherZone already exists in the home catalog
        "410":
          description: The application has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: application has expired
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          description: |
            An approve step failed (`mkzone`, editing `server_config.json`,
            or the reload) and the error names the step and what was rolled
            back, or an unhandled internal error occurred. The record stays
            `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "step reload failed: cannot read server pid file /var/run/irods/irods-server.pid: [Errno 2] No such file or directory. The catalog zone and the federation entry are in place; fix the cause and judge again to retry the reload."
        "502":
          $ref: "#/components/responses/IRODSUnreachable"

  /keyserver/local_zone:
    get:
      tags: [keyserver]
      operationId: keyserverLocalZone
      summary: Read the lifecycle of the home zone's zone_key
      description: |
        Spec section 7.2.1. Reconciles the stored zone key state against
        `server_config.json` first (spec 5.5): on first use the key found
        there is adopted and a next key is minted; a file that now holds the
        next key is treated as a rotation; a file that holds neither is
        re-adopted with a warning. A server wanting to rotate itself needs
        `next_zone_key.value` and `zone_key.expires_at`. No iRODS write is
        performed and the service never edits `server_config.json` here.
      security:
        - rodsadminBasic: []
      responses:
        "200":
          description: Current and next zone key with their timestamps.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalZoneResponse"
              example:
                zone_name: homeZone
                lifetime_of_zone_keys_in_seconds: 7776000
                zone_key:
                  value: HOME_ZONE_KEY
                  issued_at: "2026-11-01T15:04:05Z"
                  expires_at: "2027-01-30T15:04:05Z"
                next_zone_key:
                  value: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P7
                  minted_at: "2026-11-01T15:04:05Z"
                  expires_at: "2027-04-30T15:04:05Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/IRODSUnreachable"

  /bootstrap/create:
    post:
      tags: [bootstrap]
      operationId: bootstrapCreate
      summary: Create a single-use bootstrap key
      description: |
        Spec section 7.3.1. Creates one `uuid4` bootstrap key for the admin
        to hand to the operator of a new server out of band. The key is
        bound to a catalog service role, which fixes what redeeming it
        releases: a `provider` key also releases the database credentials.
        The key is single use and expires after `lifetime_in_seconds`,
        which defaults to `default_lifetime_of_bootstrap_keys_in_seconds`. Creating
        the key is the approval; nobody judges its redemption.
      security:
        - rodsadminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapCreateRequest"
            examples:
              consumer:
                summary: A consumer key with the default lifetime
                value:
                  catalog_service_role: consumer
              provider:
                summary: A provider key with a ten-minute lifetime and a note
                value:
                  catalog_service_role: provider
                  lifetime_in_seconds: 600
                  note: second provider in the server room
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapKeyRecord"
              example:
                bootstrap_key: 0b2f6c1e-7d3a-4f8b-9e21-5c4d3b2a1f00
                status: available
                catalog_service_role: consumer
                note: null
                created_at: "2026-11-01T15:04:05Z"
                created_by: rods
                expires_at: "2026-11-01T16:04:05Z"
                redeemed_at: null
                redeemed_from: null
                revoked_at: null
                revoked_by: null
        "400":
          description: |
            Malformed JSON, unknown fields, a missing or invalid
            `catalog_service_role`, a `lifetime_in_seconds` that is not a
            positive integer, or a `note` that is not a string of at most
            1024 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: catalog_service_role must be one of consumer, provider
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/IRODSUnreachable"

  /bootstrap/redeem:
    post:
      tags: [bootstrap]
      operationId: bootstrapRedeem
      summary: Redeem a bootstrap key for the zone facts
      description: |
        Spec section 7.3.2. Presents a bootstrap key and, when it is
        `available` and unexpired, receives the zone facts in this response;
        the key is consumed in the same state write. The facts are read
        verbatim from the home provider's `server_config.json` at request
        time: zone identity, the zone's current `zone_key` and
        `negotiation_key`, the catalog provider hosts, and zone-wide
        hashing, policy, and encryption settings. A `provider` key also
        receives the `database` credentials. The zone's admin password is
        not included; the operator obtains it out of band.

        The facts are delivered exactly once; no endpoint returns them
        again. An unknown, redeemed, revoked, or expired key answers `403`
        and consumes nothing. A `server_config.json` that cannot be read
        answers `500` and also consumes nothing. No iRODS operation is
        performed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapKeyBody"
            example:
              bootstrap_key: 0b2f6c1e-7d3a-4f8b-9e21-5c4d3b2a1f00
      responses:
        "200":
          description: The key was consumed and the zone facts are released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResponse"
              example:
                zone_facts:
                  catalog_service_role: provider
                  schema_name: server_config
                  schema_version: v5
                  zone_name: homeZone
                  zone_port: 1247
                  zone_user: rods
                  zone_auth_scheme: native
                  zone_key: HOME_ZONE_KEY
                  negotiation_key: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6
                  catalog_provider_hosts: [icat.home.example.org]
                  client_server_policy: CS_NEG_REFUSE
                  default_hash_scheme: SHA256
                  match_hash_policy: compatible
                  encryption:
                    algorithm: AES-256-CBC
                    key_size: 32
                    num_hash_rounds: 16
                    salt_size: 8
                  database:
                    technology: postgres
                    host: db.home.example.org
                    port: 5432
                    name: ICAT
                    odbc_driver: PostgreSQL ANSI
                    username: irods
                    password: the-database-password
        "400":
          description: Malformed JSON, unknown fields, or a missing or malformed `bootstrap_key`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: bootstrap_key must be a lower-case uuid4 string
        "403":
          $ref: "#/components/responses/BootstrapKeyRefused"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /bootstrap/revoke:
    post:
      tags: [bootstrap]
      operationId: bootstrapRevoke
      summary: Revoke an unredeemed bootstrap key
      description: |
        Spec section 7.3.3. Withdraws an `available` key so it can no
        longer be redeemed. The request body is read and parsed before the
        credentials are checked, so a malformed or oversized body answers
        `400` or `413` even without valid credentials.
      security:
        - rodsadminBasic: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapKeyBody"
            example:
              bootstrap_key: 0b2f6c1e-7d3a-4f8b-9e21-5c4d3b2a1f00
      responses:
        "200":
          description: The key is now `revoked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeResponse"
              example:
                bootstrap_key:
                  bootstrap_key: 0b2f6c1e-7d3a-4f8b-9e21-5c4d3b2a1f00
                  status: revoked
                  catalog_service_role: provider
                  note: second provider in the server room
                  created_at: "2026-11-01T15:04:05Z"
                  created_by: rods
                  expires_at: "2026-11-01T15:14:05Z"
                  redeemed_at: null
                  redeemed_from: null
                  revoked_at: "2026-11-01T15:06:00Z"
                  revoked_by: rods
        "400":
          description: Malformed JSON, unknown fields, or a missing or malformed `bootstrap_key`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "missing required field: bootstrap_key"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NoSuchBootstrapKey"
        "409":
          description: The key was already redeemed, expired, or revoked; the error names its status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: bootstrap key is already redeemed
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/IRODSUnreachable"

  /bootstrap/list:
    get:
      tags: [bootstrap]
      operationId: bootstrapList
      summary: List bootstrap keys
      description: |
        Spec section 7.3.4. Every key the service has created, filtered by
        `status` and ordered by `created_at` ascending, so the admin can see
        which are still available and when each expires, which were
        redeemed, when, and from which address, and which were revoked or
        expired unused.
      security:
        - rodsadminBasic: []
      parameters:
        - name: status
          in: query
          required: false
          description: Which keys to return. Defaults to `all`. Must be given at most once.
          schema:
            type: string
            enum: [available, redeemed, expired, revoked, all]
            default: all
      responses:
        "200":
          description: Matching keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapListResponse"
              example:
                bootstrap_keys:
                  - bootstrap_key: 0b2f6c1e-7d3a-4f8b-9e21-5c4d3b2a1f00
                    status: redeemed
                    catalog_service_role: consumer
                    note: null
                    created_at: "2026-11-01T14:00:00Z"
                    created_by: rods
                    expires_at: "2026-11-01T15:00:00Z"
                    redeemed_at: "2026-11-01T14:04:05Z"
                    redeemed_from: 203.0.113.9
                    revoked_at: null
                    revoked_by: null
                  - bootstrap_key: 7e8d9c0b-1a2f-4e3d-8c4b-5a6f7e8d9c0b
                    status: available
                    catalog_service_role: provider
                    note: second provider in the server room
                    created_at: "2026-11-01T15:30:00Z"
                    created_by: rods
                    expires_at: "2026-11-01T15:40:00Z"
                    redeemed_at: null
                    redeemed_from: null
                    revoked_at: null
                    revoked_by: null
        "400":
          description: "`status` is not one of the accepted values or was given more than once."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: status must be one of available, redeemed, expired, revoked, all
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/IRODSUnreachable"

components:
  securitySchemes:
    rodsadminBasic:
      type: http
      scheme: basic
      description: |
        Spec section 6. The username is a plain home-zone username; a
        `user#zone` form is refused with `401`. The password is verified by
        opening a real python-irodsclient session to the home zone, and the
        user must be of type `rodsadmin` or the answer is `403`. The session
        is used for any catalog changes the request performs, so they are
        attributed to the judging admin, not the service account. Nothing is
        cached between requests. The `401` challenge is
        `WWW-Authenticate: Basic realm="controlplane"`.

  responses:
    Unauthorized:
      description: |
        Missing or malformed `Authorization` header, a `user#zone` username,
        or credentials the home zone refused.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            enum: ['Basic realm="controlplane"']
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: authentication required
    Forbidden:
      description: The credentials are valid but the user is not a rodsadmin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: user alice is not a rodsadmin
    IRODSUnreachable:
      description: The home zone's iRODS server could not be reached to verify the credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "cannot reach iRODS at icat.home.example.org:1247: [Errno 111] Connection refused"
    NoSuchApplication:
      description: No application with that `application_id` exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: no such application
    BodyTooLarge:
      description: The request body exceeds `max_request_body_bytes` (default 65536).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: request body too large
    NoSuchBootstrapKey:
      description: No bootstrap key with that value exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: no such bootstrap key
    BootstrapKeyRefused:
      description: The bootstrap key is unknown, redeemed, or revoked (not distinguished), or has expired (said so). Nothing was consumed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid:
              value:
                error: bootstrap key is not valid
            expired:
              value:
                error: bootstrap key has expired
    InternalError:
      description: An unhandled error occurred while serving the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "internal error: kaboom"

  schemas:
    Error:
      type: object
      description: Every non-2xx response carries exactly this object.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human readable explanation.

    ApplicationId:
      type: string
      description: A `uuid4` string generated by the service. It is unguessable and acts as the bearer for `status`.
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      example: 6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c

    Timestamp:
      type: string
      description: ISO 8601 in UTC with a `Z` suffix and whole seconds.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
      example: "2026-10-31T15:04:05Z"

    ApplicationStatus:
      type: string
      enum: [pending, approved, rejected, expired]

    ZoneName:
      type: string
      description: Spec 5.5. Must not equal the home zone's name.
      pattern: "^[A-Za-z0-9_.]{1,63}$"
      example: otherZone

    ZonePort:
      type: integer
      minimum: 0
      maximum: 65535
      example: 1247

    CatalogProviderHosts:
      type: array
      description: |
        Spec 5.5. Each entry is an RFC 1123 hostname or an IPv4/IPv6
        literal. Approval refuses hosts that do not resolve from the control
        plane host.
      minItems: 1
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 253
      example: [icat.other.example.org]

    ZoneKey:
      type: string
      description: Spec 5.5, 5.3.
      pattern: "^[A-Za-z0-9_]{1,49}$"
      example: OPTIONAL_EXISTING_ZONE_KEY

    NegotiationKey:
      type: string
      description: Spec 5.5, 5.3. Exactly 32 characters from `A-Za-z0-9_`.
      pattern: "^[A-Za-z0-9_]{32}$"
      example: a1B2c3D4e5F6g7H8i9J0k1L2m3N4o5P6

    FederationEntry:
      type: object
      description: |
        One element of the `federation` array of an iRODS
        `server_config.json`. As `applicant_federation_entry` it describes
        the home zone for the applicant's file; as `home_federation_entry`
        it is what was appended to the home zone's file.
      required:
        - catalog_provider_hosts
        - negotiation_key
        - zone_key
        - zone_key_signing_hash_scheme
        - zone_name
        - zone_port
      additionalProperties: false
      properties:
        catalog_provider_hosts:
          $ref: "#/components/schemas/CatalogProviderHosts"
        negotiation_key:
          $ref: "#/components/schemas/NegotiationKey"
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        zone_key_signing_hash_scheme:
          type: string
          enum: [sha256]
        zone_name:
          $ref: "#/components/schemas/ZoneName"
        zone_port:
          $ref: "#/components/schemas/ZonePort"

    InfoResponse:
      type: object
      required: [service, version, federation]
      additionalProperties: false
      properties:
        service:
          type: string
          enum: [controlplane]
        version:
          type: string
          description: Version of the running service.
          example: 0.1.0
        federation:
          $ref: "#/components/schemas/FeaturePolicy"

    FeaturePolicy:
      type: object
      description: The federation settings of spec 4.2 that `/info` publishes.
      required: [application_expiration_in_seconds]
      additionalProperties: false
      properties:
        application_expiration_in_seconds:
          type: integer
          minimum: 1
          description: How long a `pending` application lives before it is `expired`.

    FederationApplyRequest:
      type: object
      description: Federation application, spec 7.1.1.
      required: [zone_name, zone_port, catalog_provider_hosts]
      additionalProperties: false
      properties:
        zone_name:
          $ref: "#/components/schemas/ZoneName"
        zone_port:
          $ref: "#/components/schemas/ZonePort"
        catalog_provider_hosts:
          $ref: "#/components/schemas/CatalogProviderHosts"
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        name:
          type: string
          description: Shown to the reviewing admin only. Never used for anything else.
          minLength: 1
          maxLength: 256
        email:
          type: string
          description: |
            Shown to the reviewing admin only. Exactly one `@` with at least
            one character on each side. Never verified, never used to send
            mail.
          minLength: 3
          maxLength: 254

    FederationApplyResponse:
      type: object
      description: "`201` body of `/federation/apply`."
      required: [application_id, status, expires_at, negotiation_key, zone_key, status_url]
      additionalProperties: false
      properties:
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        status:
          type: string
          enum: [pending]
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        negotiation_key:
          $ref: "#/components/schemas/NegotiationKey"
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        status_url:
          $ref: "#/components/schemas/StatusUrl"

    StatusUrl:
      type: string
      description: Relative URL of this application's `status` endpoint.
      pattern: "^/federation/status\\?application_id=[0-9a-f-]{36}$"
      example: /federation/status?application_id=6f1c2a8e-4b1d-4c0e-9a7f-2d3e4f5a6b7c

    FederationStatusResponse:
      type: object
      description: "`status` body while the application is not approved."
      required: [application_id, status, submitted_at, expires_at, judged_at, decision_note]
      additionalProperties: false
      properties:
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        status:
          type: string
          enum: [pending, rejected, expired]
        submitted_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        judged_at:
          type: string
          nullable: true
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          description: Null until judged.
        decision_note:
          type: string
          nullable: true
          maxLength: 1024
          description: The admin's note, null when none was given or the application is unjudged.

    ApprovedFederationStatusResponse:
      type: object
      description: "`status` body for an approved application."
      required:
        - application_id
        - status
        - submitted_at
        - expires_at
        - judged_at
        - decision_note
        - applicant_federation_entry
        - applicant_mkzone_command
      additionalProperties: false
      properties:
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        status:
          type: string
          enum: [approved]
        submitted_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        judged_at:
          $ref: "#/components/schemas/Timestamp"
        decision_note:
          type: string
          nullable: true
          maxLength: 1024
        applicant_federation_entry:
          $ref: "#/components/schemas/FederationEntry"
        applicant_mkzone_command:
          $ref: "#/components/schemas/MkzoneCommand"

    MkzoneCommand:
      type: string
      description: The `iadmin mkzone` command the applicant runs to add the home zone to its own catalog.
      pattern: "^iadmin mkzone [A-Za-z0-9_.]{1,63} remote [^ ]+:[0-9]{1,5}$"
      example: iadmin mkzone homeZone remote icat.home.example.org:1247

    FederationApplicationRecord:
      type: object
      description: The full stored federation record, spec 5.2. Returned only to rodsadmins.
      required:
        - application_id
        - status
        - submitted_at
        - expires_at
        - remote_address
        - zone_name
        - zone_port
        - catalog_provider_hosts
        - zone_key
        - zone_key_generated
        - negotiation_key
        - name
        - email
        - judged_at
        - judged_by
        - decision_note
      additionalProperties: false
      properties:
        application_id:
          $ref: "#/components/schemas/ApplicationId"
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        submitted_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        remote_address:
          type: string
          description: Peer IP of the `apply` request; the first `X-Forwarded-For` value when a proxy supplied one.
          example: 203.0.113.9
        zone_name:
          $ref: "#/components/schemas/ZoneName"
        zone_port:
          $ref: "#/components/schemas/ZonePort"
        catalog_provider_hosts:
          $ref: "#/components/schemas/CatalogProviderHosts"
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        zone_key_generated:
          type: boolean
          description: True when the service generated `zone_key` because the applicant supplied none.
        negotiation_key:
          $ref: "#/components/schemas/NegotiationKey"
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
        email:
          type: string
          nullable: true
          minLength: 3
          maxLength: 254
        judged_at:
          type: string
          nullable: true
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        judged_by:
          type: string
          nullable: true
          description: iRODS username of the judging admin, null until judged.
          pattern: "^[A-Za-z0-9_.@-]{1,63}$"
        decision_note:
          type: string
          nullable: true
          maxLength: 1024

    FederationListResponse:
      type: object
      required: [applications]
      additionalProperties: false
      properties:
        applications:
          type: array
          description: Ordered by `submitted_at` ascending.
          items:
            $ref: "#/components/schemas/FederationApplicationRecord"

    JudgeRequest:
      type: object
      required: [application_id, decision]
      additionalProperties: false
      properties:
        application_id:
          type: string
          minLength: 1
          description: The id of the application to judge.
        decision:
          type: string
          enum: [approve, reject]
        decision_note:
          type: string
          maxLength: 1024
          description: Free text stored on the record and shown to the applicant by `status`.

    RejectResponse:
      type: object
      required: [application]
      additionalProperties: false
      properties:
        application:
          $ref: "#/components/schemas/FederationApplicationRecord"

    ApproveResponse:
      type: object
      description: |
        `home_federation_entry` is what was appended to the home zone's
        `server_config.json`; `applicant_federation_entry` is the same
        object `status` returns to the applicant.
      required: [application, home_federation_entry, applicant_federation_entry, applicant_mkzone_command]
      additionalProperties: false
      properties:
        application:
          $ref: "#/components/schemas/FederationApplicationRecord"
        home_federation_entry:
          $ref: "#/components/schemas/FederationEntry"
        applicant_federation_entry:
          $ref: "#/components/schemas/FederationEntry"
        applicant_mkzone_command:
          $ref: "#/components/schemas/MkzoneCommand"

    CatalogServiceRole:
      type: string
      description: Whether the new server will be a catalog consumer or an additional catalog provider.
      enum: [consumer, provider]

    BootstrapKey:
      type: string
      description: A single-use `uuid4` created by `POST /bootstrap/create`, lower case.
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      example: 0b2f6c1e-7d3a-4f8b-9e21-5c4d3b2a1f00

    LocalZoneResponse:
      type: object
      description: Spec 7.2.1 and 5.5.
      required: [zone_name, lifetime_of_zone_keys_in_seconds, zone_key, next_zone_key]
      additionalProperties: false
      properties:
        zone_name:
          $ref: "#/components/schemas/ZoneName"
        lifetime_of_zone_keys_in_seconds:
          type: integer
          minimum: 1
        zone_key:
          type: object
          description: The key currently in `server_config.json`, when the service first saw it, and when it is meant to be rotated.
          required: [value, issued_at, expires_at]
          additionalProperties: false
          properties:
            value:
              $ref: "#/components/schemas/ZoneKey"
            issued_at:
              $ref: "#/components/schemas/Timestamp"
            expires_at:
              $ref: "#/components/schemas/Timestamp"
        next_zone_key:
          type: object
          description: The key the zone will rotate to, minted by the service.
          required: [value, minted_at, expires_at]
          additionalProperties: false
          properties:
            value:
              $ref: "#/components/schemas/ZoneKey"
            minted_at:
              $ref: "#/components/schemas/Timestamp"
            expires_at:
              $ref: "#/components/schemas/Timestamp"

    ZoneFacts:
      type: object
      description: |
        Spec 7.3.2. Every value is copied verbatim from the home provider's
        `server_config.json`. `database` is present only for the `provider`
        role, and its `host` is whatever the home provider uses, possibly
        `localhost`. Appendix A of the spec maps these onto a
        `json_configuration_file` for `setup_irods.py`.
      required:
        - catalog_service_role
        - schema_name
        - schema_version
        - zone_name
        - zone_port
        - zone_user
        - zone_auth_scheme
        - zone_key
        - negotiation_key
        - catalog_provider_hosts
        - client_server_policy
        - default_hash_scheme
        - match_hash_policy
        - encryption
      additionalProperties: false
      properties:
        catalog_service_role:
          $ref: "#/components/schemas/CatalogServiceRole"
        schema_name:
          type: string
        schema_version:
          type: string
        zone_name:
          $ref: "#/components/schemas/ZoneName"
        zone_port:
          $ref: "#/components/schemas/ZonePort"
        zone_user:
          type: string
          description: The zone's administrator username.
          maxLength: 63
        zone_auth_scheme:
          type: string
        zone_key:
          $ref: "#/components/schemas/ZoneKey"
        negotiation_key:
          $ref: "#/components/schemas/NegotiationKey"
        catalog_provider_hosts:
          $ref: "#/components/schemas/CatalogProviderHosts"
        client_server_policy:
          type: string
        default_hash_scheme:
          type: string
        match_hash_policy:
          type: string
        encryption:
          type: object
          required: [algorithm, key_size, num_hash_rounds, salt_size]
          additionalProperties: false
          properties:
            algorithm:
              type: string
            key_size:
              type: integer
            num_hash_rounds:
              type: integer
            salt_size:
              type: integer
        database:
          $ref: "#/components/schemas/DatabaseCredentials"

    DatabaseCredentials:
      type: object
      description: "`plugin_configuration.database` of the home provider, copied whole, including the password."
      required: [technology, host, port, name, odbc_driver, username, password]
      additionalProperties: true
      properties:
        technology:
          type: string
        host:
          type: string
        port:
          type: integer
        name:
          type: string
        odbc_driver:
          type: string
        username:
          type: string
        password:
          type: string

    BootstrapCreateRequest:
      type: object
      description: Spec 7.3.1.
      required: [catalog_service_role]
      additionalProperties: false
      properties:
        catalog_service_role:
          $ref: "#/components/schemas/CatalogServiceRole"
        lifetime_in_seconds:
          type: integer
          minimum: 1
          description: How long the key stays redeemable. Defaults to `default_lifetime_of_bootstrap_keys_in_seconds`.
        note:
          type: string
          maxLength: 1024
          description: Free text for the admin's own bookkeeping, shown back by `list`. Never interpreted.

    BootstrapKeyBody:
      type: object
      description: Body of `/bootstrap/redeem` and `/bootstrap/revoke`.
      required: [bootstrap_key]
      additionalProperties: false
      properties:
        bootstrap_key:
          $ref: "#/components/schemas/BootstrapKey"

    BootstrapKeyRecord:
      type: object
      description: Spec 5.3.
      required:
        - bootstrap_key
        - status
        - catalog_service_role
        - note
        - created_at
        - created_by
        - expires_at
        - redeemed_at
        - redeemed_from
        - revoked_at
        - revoked_by
      additionalProperties: false
      properties:
        bootstrap_key:
          $ref: "#/components/schemas/BootstrapKey"
        status:
          type: string
          enum: [available, redeemed, expired, revoked]
        catalog_service_role:
          $ref: "#/components/schemas/CatalogServiceRole"
        note:
          type: string
          nullable: true
          maxLength: 1024
        created_at:
          $ref: "#/components/schemas/Timestamp"
        created_by:
          type: string
          description: iRODS username of the admin who created it.
          pattern: "^[A-Za-z0-9_.@-]{1,63}$"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        redeemed_at:
          type: string
          nullable: true
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        redeemed_from:
          type: string
          nullable: true
          description: Peer IP of the `redeem` request; the first `X-Forwarded-For` value when a proxy supplied one.
        revoked_at:
          type: string
          nullable: true
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
        revoked_by:
          type: string
          nullable: true
          description: iRODS username of the admin who revoked it.
          pattern: "^[A-Za-z0-9_.@-]{1,63}$"

    RedeemResponse:
      type: object
      required: [zone_facts]
      additionalProperties: false
      properties:
        zone_facts:
          $ref: "#/components/schemas/ZoneFacts"

    RevokeResponse:
      type: object
      required: [bootstrap_key]
      additionalProperties: false
      properties:
        bootstrap_key:
          $ref: "#/components/schemas/BootstrapKeyRecord"

    BootstrapListResponse:
      type: object
      required: [bootstrap_keys]
      additionalProperties: false
      properties:
        bootstrap_keys:
          type: array
          description: Ordered by `created_at` ascending.
          items:
            $ref: "#/components/schemas/BootstrapKeyRecord"
